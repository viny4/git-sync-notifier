name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26, and a
    # runner image changing under us is not something a release should discover.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Configure git for the test repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: npm test
      - name: Package (catches manifest problems before release)
        run: npx @vscode/vsce package --allow-missing-repository --skip-license
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
