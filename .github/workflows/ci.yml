name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Configure git for the test repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: npm test
      - name: Package (catches manifest problems before release)
        run: npx @vscode/vsce package --allow-missing-repository --skip-license
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
