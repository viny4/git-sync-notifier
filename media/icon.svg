<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D3B8F"/>
      <stop offset="0.55" stop-color="#3E5BD9"/>
      <stop offset="1" stop-color="#6C3FD1"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- incoming commit chain, flowing down into your branch -->
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M64 30 V 78"/>
    <path d="M42 70 L64 94 L86 70" stroke-linejoin="round"/>
  </g>
  <circle cx="64" cy="26" r="10" fill="#FFFFFF"/>

  <!-- the branch it merges into -->
  <path d="M30 110 H98" stroke="#FFC857" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="30" cy="110" r="7" fill="#FFC857"/>
  <circle cx="98" cy="110" r="7" fill="#FFC857"/>
</svg>
